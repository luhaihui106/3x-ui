name: Real Speed Limit V1 Stock Artifact Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-client-speed-limit-v1
    paths:
      - .github/real-speedlimit/patch_upstream_release_guard.py
      - .github/workflows/real-speedlimit-upstream-release-guard.yml

permissions:
  contents: read

jobs:
  audit-stock-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-client-speed-limit-v1
          fetch-depth: 1

      - name: Audit upstream release workflow isolation
        run: |
          set -euxo pipefail
          # Upstream release.yml intentionally remains untouched for clean
          # future rebases. It builds stock Xray artifacts on branch pushes,
          # but only uploads to a GitHub Release for refs/tags/*.
          grep -q 'XTLS/Xray-core/releases/download/v26.7.28' .github/workflows/release.yml
          grep -q "startsWith(github.ref, 'refs/tags/')" .github/workflows/release.yml

          # The real limiter distribution must come exclusively from our
          # dedicated package workflow and custom Xray checkout.
          grep -q 'repository: luhaihui106/Xray-core' .github/workflows/real-speedlimit-package.yml
          grep -q 'ref: 05f4c02c8a5ab773a0c8c5bfab79759cced08fe7' .github/workflows/real-speedlimit-package.yml
          grep -q 'REAL_SPEEDLIMIT_V1' .github/workflows/real-speedlimit-package.yml
          grep -q "gh release upload dev-latest" .github/workflows/real-speedlimit-package.yml

          echo 'PASS: stock upstream workflow is identified as non-authoritative.'
          echo 'PASS: only Real Speed Limit V1 Package/dev-latest is the supported limiter distribution.'
