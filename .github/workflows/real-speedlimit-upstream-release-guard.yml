name: Real Speed Limit V1 Upstream Release Guard

on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-client-speed-limit-v1
    paths:
      - .github/real-speedlimit/patch_upstream_release_guard.py
      - .github/workflows/real-speedlimit-upstream-release-guard.yml

permissions:
  contents: write

jobs:
  guard-upstream-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-client-speed-limit-v1
          fetch-depth: 0

      - name: Guard upstream release workflow
        run: |
          python3 .github/real-speedlimit/patch_upstream_release_guard.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/release.yml').read_text()
          guard = "github.ref != 'refs/heads/feature/real-client-speed-limit-v1' && github.head_ref != 'feature/real-client-speed-limit-v1'"
          if s.count('if: ' + guard) < 2:
              raise SystemExit('expected guard on upstream release jobs')
          print('upstream release jobs are guarded')
          PY

      - name: Commit guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          if git diff --cached --quiet; then
            echo 'Upstream release guard already applied'
          else
            git commit -m 'fix: prevent stock-Xray artifacts on speedlimit branch'
            git fetch origin feature/real-client-speed-limit-v1
            git rebase origin/feature/real-client-speed-limit-v1
            git push origin HEAD:feature/real-client-speed-limit-v1
          fi
